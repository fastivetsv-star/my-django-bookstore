version: '3.9'

services:
  # === БАЗИ ДАНИХ ТА КЕШ ===
  db_a:
    image: postgres:15-alpine
    env_file:
      - ./mysite/.env 
    volumes:
      - postgres_data_a:/var/lib/postgresql/data 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db_b:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_password
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    container_name: shop_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === PROJECT A (Основний магазин) ===
  project_a_shop:
    build: ./mysite
    container_name: project_a_web
    command: gunicorn mysite.wsgi:application --bind 0.0.0.0:8001
    env_file:
      - ./mysite/.env
    volumes:
      - ./mysite:/app 
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8001:8001"
    depends_on:
      db_a:
        condition: service_healthy 
      redis:
        condition: service_healthy 

  celery:
    build: ./mysite
    container_name: shop_celery
    command: celery -A mysite worker --loglevel=info
    env_file:
      - ./mysite/.env
    volumes:
      - ./mysite:/app
    depends_on:
      - redis
      - db_a

  celery-beat:
    build: ./mysite
    container_name: shop_celery_beat
    command: celery -A mysite beat --loglevel=info
    env_file:
      - ./mysite/.env
    volumes:
      - ./mysite:/app
    depends_on:
      - redis

  # === PROJECT B (Платіжний сервіс) ===
  project_b_payment:
    build: ./my-payment-service
    container_name: project_b_web
    command: gunicorn payment_core.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./my-payment-service:/app
    ports:
      - "8000:8000"
    depends_on:
      - db_b

  # === NGINX (Воротар) ===
  nginx:
    image: nginx:alpine
    container_name: shop_nginx
    ports:
      - "80:80"
    volumes:
      - ./mysite/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - project_a_shop

volumes:
  postgres_data_a:
  static_volume:
  media_volume: