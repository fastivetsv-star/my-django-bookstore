name: Django CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: superbook_db
          POSTGRES_USER: super_user
          POSTGRES_PASSWORD: super_secret_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Завантаження коду
      uses: actions/checkout@v3

    - name: Встановлення Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Встановлення залежностей
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Перевірка стилю коду (Black)
      run: black --check .

    - name: Пошук помилок (Flake8)
      run: flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Запуск тестів (Pytest + Coverage)
      env:
        SECRET_KEY: 'dummy-secret-key-for-tests'
        DB_HOST: localhost # Вказуємо тестам шукати базу даних локально
      run: |
        pytest --cov=.

  build-and-push:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
    - name: Завантаження коду
      uses: actions/checkout@v3

    - name: Логін у Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Збірка і відправка Docker Image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/shop-web:latest