name: Django CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
    - name: Завантаження коду
      uses: actions/checkout@v3

    - name: Встановлення Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11' 

    - name: Встановлення залежностей
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Перевірка стилю коду (Black)
      run: black --check .

    - name: Пошук помилок (Flake8)
      run: flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Запуск тестів (Pytest + Coverage)
      env:
        SECRET_KEY: 'dummy-secret-key-for-tests'
      run: |
        pytest --cov=.

  build-and-push:
    needs: test-and-lint 
    runs-on: ubuntu-latest
    steps:
    - name: Завантаження коду
      uses: actions/checkout@v3

    - name: Логін у Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Збірка і відправка Docker Image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/shop-web:latest