name: Django CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    # Наші тимчасові сервіси для тестів
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: superbook_db
          POSTGRES_USER: super_user
          POSTGRES_PASSWORD: super_secret_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      # ДОДАНО: Сервіс Redis для кешування та Celery
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - name: Завантаження коду
      uses: actions/checkout@v4

    - name: Встановлення Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Встановлення залежностей
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # ДОДАНО: Вчимо робота розуміти ім'я "redis"
    - name: Налаштування хостів (щоб тести знайшли Redis)
      run: echo "127.0.0.1 redis" | sudo tee -a /etc/hosts

    - name: Перевірка стилю коду (Black)
      run: black --check .

    - name: Пошук помилок (Flake8)
      run: flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Запуск тестів (Pytest + Coverage)
      env:
        SECRET_KEY: 'dummy-secret-key-for-tests'
        DB_HOST: localhost 
      run: |
        pytest --cov=.

  build-and-push:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
    - name: Завантаження коду
      uses: actions/checkout@v4

    - name: Логін у Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Збірка і відправка Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-django-bookstore:latest